<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>马子纯数独</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(135deg, #ffd6e7 0%, #ffb3d1 40%, #ff85b8 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: #c2185b;
      text-shadow: 2px 2px 0px #fff, 4px 4px 0px #f8bbd0;
      margin-bottom: 6px;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #e91e8c;
      margin-bottom: 20px;
      font-weight: 600;
      background: rgba(255,255,255,0.5);
      padding: 4px 14px;
      border-radius: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 28px;
      box-shadow: 0 8px 32px rgba(194, 24, 91, 0.18), 0 2px 8px rgba(0,0,0,0.07);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    /* ── Board ── */
    #board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 3px;
      background: #e91e8c;
      border-radius: 16px;
      padding: 6px;
      box-shadow: 0 4px 16px rgba(233,30,140,0.25);
    }

    .cell {
      width: 50px;
      height: 50px;
      background: #fff0f6;
      border: none;
      border-radius: 10px;
      text-align: center;
      font-family: 'Nunito', cursive, sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: #c2185b;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      outline: none;
      caret-color: transparent;
      user-select: none;
    }

    /* Thick borders for 3×3 boxes */
    .cell[data-col="2"], .cell[data-col="5"] { margin-right: 3px; border-right: 3px solid #e91e8c; border-radius: 10px 0 0 10px; }
    .cell[data-col="3"], .cell[data-col="6"] { margin-left: 0; }
    .cell[data-row="2"], .cell[data-row="5"] { margin-bottom: 3px; border-bottom: 3px solid #e91e8c; }
    .cell[data-row="3"], .cell[data-row="6"] { margin-top: 0; }

    .cell.given {
      background: #fce4ec;
      color: #880e4f;
      cursor: default;
      font-weight: 800;
    }

    .cell:not(.given):hover {
      background: #ffd6e7;
      transform: scale(1.07);
      box-shadow: 0 2px 10px rgba(233,30,140,0.25);
    }

    .cell.selected {
      background: #f48fb1 !important;
      color: #fff !important;
      transform: scale(1.1);
      box-shadow: 0 4px 14px rgba(233,30,140,0.4);
      z-index: 2;
      position: relative;
    }

    .cell.highlight {
      background: #ffe0ee;
    }

    .cell.error {
      color: #e53935 !important;
      background: #ffd0d0 !important;
      animation: shake 0.3s;
    }

    .cell.correct {
      color: #388e3c !important;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    /* ── Numpad ── */
    .numpad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 320px;
    }

    .num-btn {
      padding: 12px 0;
      border: none;
      border-radius: 14px;
      background: linear-gradient(145deg, #f8bbd0, #f48fb1);
      color: #880e4f;
      font-family: 'Nunito', cursive, sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 3px 8px rgba(233,30,140,0.2);
    }

    .num-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 6px 14px rgba(233,30,140,0.35);
    }

    .num-btn:active { transform: scale(0.96); }

    .erase-btn {
      background: linear-gradient(145deg, #f5f5f5, #e0e0e0);
      color: #c2185b;
      font-size: 1rem;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .ctrl-btn {
      padding: 10px 22px;
      border: none;
      border-radius: 20px;
      font-family: 'Nunito', cursive, sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 3px 8px rgba(0,0,0,0.12);
    }

    .btn-new {
      background: linear-gradient(135deg, #e91e8c, #c2185b);
      color: #fff;
    }

    .btn-check {
      background: linear-gradient(135deg, #f48fb1, #f06292);
      color: #fff;
    }

    .btn-hint {
      background: linear-gradient(135deg, #fff9c4, #fff176);
      color: #c2185b;
    }

    .ctrl-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }

    /* ── Status ── */
    #status {
      font-size: 1rem;
      font-weight: 700;
      color: #c2185b;
      min-height: 1.4em;
      text-align: center;
    }

    #status.win {
      font-size: 1.3rem;
      color: #2e7d32;
      animation: pop 0.4s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      80% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Timer */
    #timer {
      font-size: 1rem;
      font-weight: 700;
      color: #ad1457;
      background: rgba(255,255,255,0.6);
      padding: 4px 16px;
      border-radius: 20px;
    }

    @media (max-width: 500px) {
      .cell { width: 36px; height: 36px; font-size: 1.05rem; border-radius: 7px; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<h1>马子纯数独</h1>
<div class="subtitle">简单难度 · 粉色主题</div>

<div class="card">
  <div id="timer">⏱ 00:00</div>
  <div id="board"></div>

  <div class="numpad" id="numpad"></div>

  <div class="controls">
    <button class="ctrl-btn btn-new" onclick="newGame()">新游戏</button>
    <button class="ctrl-btn btn-check" onclick="checkAll()">检查</button>
    <button class="ctrl-btn btn-hint" onclick="giveHint()">提示</button>
  </div>

  <div id="status"></div>
</div>

<script>
// ── Easy puzzles pool ──────────────────────────────────────────────────────
const PUZZLES = [
  // puzzle | solution pairs  (0 = blank)
  {
    puzzle: [
      5,3,0, 0,7,0, 0,0,0,
      6,0,0, 1,9,5, 0,0,0,
      0,9,8, 0,0,0, 0,6,0,

      8,0,0, 0,6,0, 0,0,3,
      4,0,0, 8,0,3, 0,0,1,
      7,0,0, 0,2,0, 0,0,6,

      0,6,0, 0,0,0, 2,8,0,
      0,0,0, 4,1,9, 0,0,5,
      0,0,0, 0,8,0, 0,7,9
    ],
    solution: [
      5,3,4, 6,7,8, 9,1,2,
      6,7,2, 1,9,5, 3,4,8,
      1,9,8, 3,4,2, 5,6,7,

      8,5,9, 7,6,1, 4,2,3,
      4,2,6, 8,5,3, 7,9,1,
      7,1,3, 9,2,4, 8,5,6,

      9,6,1, 5,3,7, 2,8,4,
      2,8,7, 4,1,9, 6,3,5,
      3,4,5, 2,8,6, 1,7,9
    ]
  },
  {
    puzzle: [
      0,0,3, 0,2,0, 6,0,0,
      9,0,0, 3,0,5, 0,0,1,
      0,0,1, 8,0,6, 4,0,0,

      0,0,8, 1,0,2, 9,0,0,
      7,0,0, 0,0,0, 0,0,8,
      0,0,6, 7,0,8, 2,0,0,

      0,0,2, 6,0,9, 5,0,0,
      8,0,0, 2,0,3, 0,0,9,
      0,0,5, 0,1,0, 3,0,0
    ],
    solution: [
      4,8,3, 9,2,1, 6,5,7,
      9,6,7, 3,4,5, 8,2,1,
      2,5,1, 8,7,6, 4,9,3,

      5,4,8, 1,3,2, 9,7,6,
      7,2,9, 5,6,4, 1,3,8,
      1,3,6, 7,9,8, 2,4,5,

      3,7,2, 6,8,9, 5,1,4,
      8,1,4, 2,5,3, 7,6,9,
      6,9,5, 4,1,7, 3,8,2
    ]
  },
  {
    puzzle: [
      0,2,0, 6,0,8, 0,0,0,
      5,8,0, 0,0,9, 7,0,0,
      0,0,0, 0,4,0, 0,0,0,

      3,7,0, 0,0,0, 5,0,0,
      6,0,0, 0,0,0, 0,0,4,
      0,0,8, 0,0,0, 0,1,3,

      0,0,0, 0,2,0, 0,0,0,
      0,0,9, 8,0,0, 0,3,6,
      0,0,0, 3,0,6, 0,9,0
    ],
    solution: [
      1,2,3, 6,7,8, 9,4,5,
      5,8,4, 2,3,9, 7,6,1,
      9,6,7, 1,4,5, 3,2,8,

      3,7,2, 4,6,1, 5,8,9,
      6,9,1, 5,8,3, 2,7,4,
      4,5,8, 7,9,2, 6,1,3,

      8,3,6, 9,2,4, 1,5,7,
      2,1,9, 8,5,7, 4,3,6,
      7,4,5, 3,1,6, 8,9,2
    ]
  }
];

// ── State ──────────────────────────────────────────────────────────────────
let puzzle, solution, userGrid, selectedIdx, timerSec, timerHandle;

function newGame() {
  clearInterval(timerHandle);
  timerSec = 0;
  updateTimer();
  timerHandle = setInterval(() => { timerSec++; updateTimer(); }, 1000);

  const p = PUZZLES[Math.floor(Math.random() * PUZZLES.length)];
  puzzle   = [...p.puzzle];
  solution = [...p.solution];
  userGrid = puzzle.map(v => v === 0 ? 0 : v);
  selectedIdx = null;
  document.getElementById('status').textContent = '';
  document.getElementById('status').className = '';
  renderBoard();
}

function updateTimer() {
  const m = String(Math.floor(timerSec / 60)).padStart(2,'0');
  const s = String(timerSec % 60).padStart(2,'0');
  document.getElementById('timer').textContent = `⏱ ${m}:${s}`;
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (let i = 0; i < 81; i++) {
    const r = Math.floor(i / 9), c = i % 9;
    const cell = document.createElement('div');
    cell.className = 'cell' + (puzzle[i] !== 0 ? ' given' : '');
    cell.dataset.idx = i;
    cell.dataset.row = r;
    cell.dataset.col = c;
    cell.textContent = userGrid[i] !== 0 ? userGrid[i] : '';
    cell.addEventListener('click', () => selectCell(i));
    board.appendChild(cell);
  }
  highlightRelated();
}

function getCells() { return document.querySelectorAll('.cell'); }

function selectCell(idx) {
  if (puzzle[idx] !== 0) { selectedIdx = idx; highlightRelated(); return; }
  selectedIdx = idx;
  highlightRelated();
}

function highlightRelated() {
  const cells = getCells();
  cells.forEach(c => c.classList.remove('selected','highlight'));
  if (selectedIdx === null) return;
  const r = Math.floor(selectedIdx / 9), col = selectedIdx % 9;
  const boxR = Math.floor(r / 3) * 3, boxC = Math.floor(col / 3) * 3;
  cells.forEach(c => {
    const ci = +c.dataset.idx, cr = Math.floor(ci / 9), cc = ci % 9;
    if (cr === r || cc === col || (Math.floor(cr/3)*3 === boxR && Math.floor(cc/3)*3 === boxC))
      c.classList.add('highlight');
  });
  cells[selectedIdx].classList.remove('highlight');
  cells[selectedIdx].classList.add('selected');
}

// ── Input ──────────────────────────────────────────────────────────────────
function enterNumber(n) {
  if (selectedIdx === null) return;
  if (puzzle[selectedIdx] !== 0) return;
  userGrid[selectedIdx] = n;
  const cell = getCells()[selectedIdx];
  cell.textContent = n === 0 ? '' : n;
  cell.classList.remove('error','correct');
  if (n !== 0) {
    if (n !== solution[selectedIdx]) {
      cell.classList.add('error');
    } else {
      cell.classList.add('correct');
      checkWin();
    }
  }
}

// keyboard
document.addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '9') enterNumber(+e.key);
  else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') enterNumber(0);
  else if (e.key === 'ArrowRight') navigate(1);
  else if (e.key === 'ArrowLeft')  navigate(-1);
  else if (e.key === 'ArrowDown')  navigate(9);
  else if (e.key === 'ArrowUp')    navigate(-9);
});

function navigate(delta) {
  if (selectedIdx === null) { selectedIdx = 0; }
  else { selectedIdx = Math.max(0, Math.min(80, selectedIdx + delta)); }
  highlightRelated();
}

// ── Check / Hint / Win ─────────────────────────────────────────────────────
function checkAll() {
  const cells = getCells();
  let allCorrect = true;
  for (let i = 0; i < 81; i++) {
    cells[i].classList.remove('error','correct');
    if (userGrid[i] === 0) { allCorrect = false; continue; }
    if (userGrid[i] !== solution[i]) { cells[i].classList.add('error'); allCorrect = false; }
    else cells[i].classList.add('correct');
  }
  if (allCorrect) winGame();
  else document.getElementById('status').textContent = '还有一些错误，继续努力！💪';
}

function giveHint() {
  const blanks = [];
  for (let i = 0; i < 81; i++) if (userGrid[i] === 0) blanks.push(i);
  if (blanks.length === 0) return;
  const idx = blanks[Math.floor(Math.random() * blanks.length)];
  selectedIdx = idx;
  enterNumber(solution[idx]);
  highlightRelated();
}

function checkWin() {
  for (let i = 0; i < 81; i++) if (userGrid[i] !== solution[i]) return;
  winGame();
}

function winGame() {
  clearInterval(timerHandle);
  const m = String(Math.floor(timerSec/60)).padStart(2,'0');
  const s = String(timerSec % 60).padStart(2,'0');
  const st = document.getElementById('status');
  st.textContent = `🎉 恭喜完成！用时 ${m}:${s}，好棒呀马子纯！`;
  st.className = 'win';
}

// ── Build numpad ───────────────────────────────────────────────────────────
function buildNumpad() {
  const pad = document.getElementById('numpad');
  for (let n = 1; n <= 9; n++) {
    const btn = document.createElement('button');
    btn.className = 'num-btn';
    btn.textContent = n;
    btn.addEventListener('click', () => enterNumber(n));
    pad.appendChild(btn);
  }
  const erase = document.createElement('button');
  erase.className = 'num-btn erase-btn';
  erase.textContent = '✕';
  erase.addEventListener('click', () => enterNumber(0));
  pad.appendChild(erase);
}

// ── Init ───────────────────────────────────────────────────────────────────
buildNumpad();
newGame();
</script>
</body>
</html>
